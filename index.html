<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#F7D543"/><meta name="description" content="Explore a focused, premium fitness experience with Pure Fitness."/><title>Pure Fitness — Stronger starts here</title><style>#initial-loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;width:100vw;height:100vh;background:#0b0b0b;opacity:1;transition:opacity .35s ease,visibility .35s ease}.loader-content{display:flex;flex-direction:column;align-items:center;gap:18px}.loader-content img{width:min(480px,76vw);height:min(480px,76vw);object-fit:contain}.loader-progress{width:min(180px,42vw);height:3px;overflow:hidden;border-radius:99px;background:#ffffff30}.loader-progress span{display:block;width:40%;height:100%;border-radius:inherit;background:#F7D543;animation:loader-progress 1s ease-in-out infinite alternate}@keyframes loader-progress{from{transform:translateX(-100%)}to{transform:translateX(250%)}}#initial-loader.is-hidden{opacity:0;visibility:hidden;pointer-events:none}@media(prefers-reduced-motion:reduce){#initial-loader{transition:none}.loader-progress span{width:55%;animation:none}}</style></head><body><div id="root"></div><div id="initial-loader" role="status" aria-label="Loading Pure Fitness"><div class="loader-content"><img src="/assets/images/logo.png" alt="Pure Fitness"/><div class="loader-progress" aria-hidden="true"><span></span></div></div></div><script type="module" src="/src/main.jsx"></script></body></html>
